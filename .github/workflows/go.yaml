on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

name: Build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Check PR title
      if: github.event_name == 'pull_request'
      uses: thehanimo/pr-title-checker@v1.4.3
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        configuration_path: .github/pr-title-checker-config.json

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
        cache: true

    - name: Test
      run: go test -cover -coverprofile=coverage.txt ./...

    - name: Archive code coverage results
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage
        path: coverage.txt

    - name: Build
      run: go build -v ./...

  code_coverage:
    name: "Code coverage report"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
    - uses: fgrosse/go-coverage-report@v1.3.0

  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - uses: mlugg/setup-zig@v2

    - name: Download macOS SDK
      run: |
        curl -L https://github.com/joseluisq/macosx-sdks/releases/download/13.3/MacOSX13.3.sdk.tar.xz -o sdk.tar.xz
        tar -xf sdk.tar.xz
        echo "SDK_PATH=$PWD/MacOSX13.3.sdk" >> $GITHUB_ENV

    - name: Cross-compile linux/amd64
      run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 CC="zig cc -target x86_64-linux-musl -lc" go build -v ./...

    - name: Cross-compile linux/arm64
      run: CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC="zig cc -target aarch64-linux-musl -lc" go build -v ./...

    - name: Cross-compile darwin/amd64
      run: CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC="zig cc -target x86_64-macos -isysroot $SDK_PATH" go build -v ./...

    - name: Cross-compile darwin/arm64
      run: CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CC="zig cc -target aarch64-macos -isysroot $SDK_PATH" go build -v ./...

