name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - uses: goreleaser/goreleaser-action@v7
      if: success() && startsWith(github.ref, 'refs/tags/')
      with:
        version: latest
        args: release --draft
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}

