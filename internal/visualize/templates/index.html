<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Embedding Viewer</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; }
        #plot { width: 100vw; height: 100vh; }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: #555;
            background: rgba(255, 255, 255, 0.9);
            padding: 1rem 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 350px;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex-grow: 1;
            font-size: 14px;
        }
        #results {
            margin-top: 15px;
            border-top: 1px solid #eee;
            padding-top: 15px;
            max-height: 70vh;
            overflow-y: auto;
        }
        .result-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 4px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 13px;
            line-height: 1.4;
        }
        .result-text h1, .result-text h2, .result-text h3 { font-size: 1.1em; margin: 5px 0; }
        .result-text p { margin: 5px 0; }
        .result-text pre { background: #eee; padding: 5px; border-radius: 3px; overflow-x: auto; }
        .result-text code { background: #eee; padding: 1px 3px; border-radius: 2px; }
        .result-header {
            font-weight: bold;
            color: #007bff;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        button {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #docOverlay {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 400px;
            max-height: 90vh;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 200;
            display: none;
            flex-direction: column;
        }
        #docOverlayHeader {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        #docContent {
            padding: 20px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }
        #docContent h1, #docContent h2, #docContent h3 { margin-top: 10px; margin-bottom: 10px; }
        #docContent code { background: #f4f4f4; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
        #docContent pre { background: #f4f4f4; padding: 10px; border-radius: 4px; overflow-x: auto; margin: 10px 0; }
        #docContent pre code { background: transparent; padding: 0; }
        #docContent img { max-width: 100%; }
        #docContent ul, #docContent ol { padding-left: 20px; }
        .close-btn {
            cursor: pointer;
            font-size: 20px;
            color: #999;
        }
        .close-btn:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div id="loading">Loading Embeddings and Calculating PCA...</div>
    <div id="controls" style="display:none;">
        <div class="input-row">
            <input type="text" id="promptInput" placeholder="Enter a prompt...">
            <button id="searchBtn">Project</button>
        </div>
        <div id="results" style="display:none;">
            <h4 style="margin:0 0 10px 0;">Nearest Documents</h4>
            <div id="resultsList"></div>
        </div>
    </div>
    <div id="docOverlay">
        <div id="docOverlayHeader">
            <span id="docTitle">Document Content</span>
            <span class="close-btn" onclick="closeDocOverlay()">&times;</span>
        </div>
        <div id="docContent"></div>
    </div>
    <div id="plot"></div>

    <script>
        let plotData = [];
        let promptTraceIndex = -1;
        let connectionsTraceIndex = -1;

        function closeDocOverlay() {
            document.getElementById('docOverlay').style.display = 'none';
        }

        async function fetchFullDocument(id) {
            try {
                const response = await fetch(`/api/document/${id}`);
                if (!response.ok) throw new Error('Failed to fetch document');
                const doc = await response.json();

                document.getElementById('docTitle').innerText = `Document ID: ${doc.id}`;

                let html = '';
                if (doc.parent_id) {
                    html += `<div style="margin-bottom:15px; padding-bottom:10px; border-bottom:1px solid #eee;">
                        <a href="#" onclick="event.preventDefault(); fetchFullDocument('${doc.parent_id}')"
                           style="color:#007bff; text-decoration:none; font-size:13px;">
                            View Parent Section (ID: ${doc.parent_id})
                        </a>
                    </div>`;
                }
                html += marked.parse(doc.content);

                document.getElementById('docContent').innerHTML = html;
                document.getElementById('docOverlay').style.display = 'flex';
            } catch (err) {
                alert('Error loading document: ' + err.message);
            }
        }

        async function loadData() {
            try {
                console.log('Fetching embeddings from /api/embeddings...');
                const response = await fetch('/api/embeddings');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                console.log('Received data, items:', data.length);

                if (data.length === 0) {
                    console.warn('No embeddings found in the database.');
                    document.getElementById('loading').innerText = "No embeddings found in the database.";
                    return;
                }

                console.log('Mapping data to plot points...');
                const x = data.map(d => d.x);
                const y = data.map(d => d.y);
                const z = data.map(d => d.z);
                const text = data.map(d => d.text);
                const ids = data.map(d => d.id);

                console.log('Building Plotly trace...');
                const mainTrace = {
                    x: x,
                    y: y,
                    z: z,
                    customdata: ids,
                    mode: 'markers',
                    type: 'scatter3d',
                    name: 'Documents',
                    text: text,
                    hoverinfo: 'text',
                    marker: {
                        size: 3,
                        color: z,
                        colorscale: 'Viridis',
                        opacity: 0.6
                    }
                };

                const layout = {
                    title: '3D Embedding Visualization (PCA)',
                    margin: { l: 0, r: 0, b: 0, t: 40 },
                    legend: { x: 0, y: 1 },
                    scene: {
                        xaxis: { title: 'PC1' },
                        yaxis: { title: 'PC2' },
                        zaxis: { title: 'PC3' }
                    }
                };

                plotData = [mainTrace];
                console.log('Rendering plot...');
                const plotElement = document.getElementById('plot');
                Plotly.newPlot(plotElement, plotData, layout);

                plotElement.on('plotly_click', function(data) {
                    const point = data.points[0];
                    if (point.customdata) {
                        fetchFullDocument(point.customdata);
                    }
                });

                console.log('Plot rendered successfully.');

                document.getElementById('loading').style.display = 'none';
                document.getElementById('controls').style.display = 'flex';

            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('loading').innerText = "Error loading data: " + error.message;
            }
        }

        async function projectPrompt() {
            const input = document.getElementById('promptInput');
            const btn = document.getElementById('searchBtn');
            const prompt = input.value.trim();
            const resultsPanel = document.getElementById('results');
            const resultsList = document.getElementById('resultsList');

            if (!prompt) return;

            btn.disabled = true;
            btn.innerText = 'Searching...';

            try {
                const response = await fetch('/api/project-prompt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(errText || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                console.log('Prompt projected to:', data);

                const promptTrace = {
                    x: [data.x],
                    y: [data.y],
                    z: [data.z],
                    mode: 'markers+text',
                    type: 'scatter3d',
                    name: 'User Prompt',
                    text: [data.text],
                    textposition: 'top center',
                    marker: {
                        size: 8,
                        color: 'red',
                        symbol: 'diamond',
                        line: { color: 'white', width: 2 }
                    }
                };

                const connectionsTrace = {
                    x: [],
                    y: [],
                    z: [],
                    mode: 'lines',
                    type: 'scatter3d',
                    name: 'Connections',
                    line: { color: 'rgba(255, 0, 0, 0.4)', width: 2 },
                    hoverinfo: 'none'
                };

                if (data.nearest_documents) {
                    data.nearest_documents.forEach(doc => {
                        connectionsTrace.x.push(data.x, doc.x, null);
                        connectionsTrace.y.push(data.y, doc.y, null);
                        connectionsTrace.z.push(data.z, doc.z, null);
                    });
                }

                if (promptTraceIndex === -1) {
                    plotData.push(promptTrace);
                    promptTraceIndex = plotData.length - 1;

                    plotData.push(connectionsTrace);
                    connectionsTraceIndex = plotData.length - 1;

                    Plotly.redraw('plot');
                } else {
                    plotData[promptTraceIndex] = promptTrace;
                    plotData[connectionsTraceIndex] = connectionsTrace;
                    Plotly.react('plot', plotData, document.getElementById('plot').layout);
                }

                resultsList.innerHTML = '';
                if (data.nearest_documents && data.nearest_documents.length > 0) {
                    data.nearest_documents.forEach((doc, idx) => {
                        const item = document.createElement('div');
                        item.className = 'result-item';
                        item.style.cursor = 'pointer';
                        item.onclick = () => fetchFullDocument(doc.id);
                        item.innerHTML = `
                            <div class="result-header">
                                <span>#${idx + 1} Document ID: ${doc.id}</span>
                            </div>
                            <div class="result-text">${marked.parse(doc.text)}</div>
                        `;
                        resultsList.appendChild(item);
                    });
                    resultsPanel.style.display = 'block';
                }

                Plotly.relayout('plot', {
                    'scene.camera': {
                        center: { x: 0, y: 0, z: 0 },
                        eye: { x: data.x * 2 || 1.5, y: data.y * 2 || 1.5, z: data.z * 2 || 1.5 }
                    }
                });

            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Project';
            }
        }

        document.getElementById('searchBtn').addEventListener('click', projectPrompt);
        document.getElementById('promptInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') projectPrompt();
        });

        loadData();
    </script>
</body>
</html>
